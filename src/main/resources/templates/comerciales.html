<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comerciales | Ventas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
	<div class="container">
		<a class="navbar-brand" th:href="@{/clientes}">Gestión de ventas</a>
		<div class="navbar-nav">
			<a class="nav-link" th:href="@{/clientes}">Clientes</a>
			<a class="nav-link active" th:href="@{/comerciales}">Comerciales</a>
		</div>
	</div>
</nav>
<main class="container py-4">
	<div class="row align-items-center g-3 mb-3">
		<div class="col-12 col-md">
			<h1 class="h2 mb-0">Comerciales</h1>
		</div>
		<div class="col-12 col-md-auto">
			<a class="btn btn-primary" th:href="@{/comerciales/crear}">Nuevo comercial</a>
		</div>
	</div>
	<div class="table-responsive bg-white rounded shadow-sm">
		<table class="table table-striped table-hover align-middle mb-0">
			<thead class="table-primary">
			<tr>
				<th scope="col">Código</th>
				<th scope="col">Nombre</th>
				<th scope="col">Apellidos</th>
				<th scope="col">Comisión</th>
				<th scope="col" class="text-end">Acciones</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="comercial : ${listaComerciales}">
				<td th:text="${comercial.id}">1</td>
				<td th:text="${comercial.nombre}">Nombre</td>
				<td th:text="${comercial.apellido1 + ' ' + comercial.apellido2}">Apellidos</td>
				<td th:text="${comercial.comision}">0.00</td>
				<td class="text-end text-nowrap">
					<a class="btn btn-sm btn-outline-secondary" th:href="@{/comerciales/{id}(id=${comercial.id})}">Ver</a>
					<a class="btn btn-sm btn-outline-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
					<form class="d-inline" th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="post">
						<button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
					</form>
				</td>
			</tr>
			<tr th:if="${#lists.isEmpty(listaComerciales)}">
				<td colspan="5" class="text-center text-secondary py-4">Todavía no hay comerciales registrados.</td>
			</tr>
			</tbody>
		</table>
	</div>
</main>
</body>
</html>
