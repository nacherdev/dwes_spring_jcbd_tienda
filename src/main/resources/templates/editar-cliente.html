<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Editar cliente | Ventas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
	<div class="row justify-content-center">
		<div class="col-12 col-lg-8">
			<div class="card shadow-sm">
				<div class="card-header bg-primary text-white"><h1 class="h4 mb-0">Editar cliente</h1></div>
				<div class="card-body">
					<form th:action="@{/clientes/editar/{id}(id=${cliente.id})}" th:object="${cliente}" method="post">
						<div class="row g-3">
							<div class="col-12 col-md-6">
								<label class="form-label" for="id">ID</label>
								<input class="form-control" id="id" th:field="*{id}" readonly>
							</div>
							<div class="col-12 col-md-6">
								<label class="form-label" for="nombre">Nombre</label>
								<input class="form-control" id="nombre" th:field="*{nombre}" maxlength="100" required>
							</div>
							<div class="col-12 col-md-6">
								<label class="form-label" for="apellido1">Primer apellido</label>
								<input class="form-control" id="apellido1" th:field="*{apellido1}" maxlength="100" required>
							</div>
							<div class="col-12 col-md-6">
								<label class="form-label" for="apellido2">Segundo apellido</label>
								<input class="form-control" id="apellido2" th:field="*{apellido2}" maxlength="100">
							</div>
							<div class="col-12 col-md-6">
								<label class="form-label" for="ciudad">Ciudad</label>
								<input class="form-control" id="ciudad" th:field="*{ciudad}" maxlength="100">
							</div>
							<div class="col-12 col-md-6">
								<label class="form-label" for="categoria">Categoría</label>
								<input class="form-control" id="categoria" type="number" th:field="*{categoria}" min="0">
							</div>
							<div class="col-12 d-flex gap-2">
								<button class="btn btn-primary" type="submit">Guardar cambios</button>
								<a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</main>
</body>
</html>
