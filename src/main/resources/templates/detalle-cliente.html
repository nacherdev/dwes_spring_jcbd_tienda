<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Detalle del cliente | Ventas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
	<div class="row justify-content-center">
		<div class="col-12 col-lg-8">
			<div class="card shadow-sm">
				<div class="card-header bg-primary text-white"><h1 class="h4 mb-0">Detalle del cliente</h1></div>
				<div class="card-body">
					<dl class="row mb-0">
						<dt class="col-sm-4">ID</dt><dd class="col-sm-8" th:text="${cliente.id}">1</dd>
						<dt class="col-sm-4">Nombre</dt><dd class="col-sm-8" th:text="${cliente.nombre}">Nombre</dd>
						<dt class="col-sm-4">Primer apellido</dt><dd class="col-sm-8" th:text="${cliente.apellido1}">Apellido</dd>
						<dt class="col-sm-4">Segundo apellido</dt><dd class="col-sm-8" th:text="${cliente.apellido2 ?: '—'}">—</dd>
						<dt class="col-sm-4">Ciudad</dt><dd class="col-sm-8" th:text="${cliente.ciudad ?: '—'}">—</dd>
						<dt class="col-sm-4">Categoría</dt><dd class="col-sm-8" th:text="${cliente.categoria ?: '—'}">—</dd>
					</dl>
					<div class="d-flex gap-2 mt-3">
						<a class="btn btn-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
						<a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver a clientes</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</main>
</body>
</html>
